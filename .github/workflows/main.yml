name: Validate with Hassfest

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "home-assistant/actions/hassfest@master"
  hacs:
    name: HACS Action
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - name: HACS Action
        uses: "hacs/action@main"
        with:
          category: "integration"
  test:
    name: Hub tests (pymodbus ${{ matrix.pymodbus }})
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        include:
          # The pymodbus pin of Home Assistant core, with the Python it needs.
          - pymodbus: "3.11.2"
            python: "3.13"
          - pymodbus: "3.13.1"
            python: "3.14"
    steps:
      - uses: "actions/checkout@v4"
        with:
          fetch-depth: 0
      - uses: "actions/setup-python@v5"
        with:
          python-version: "${{ matrix.python }}"
      - name: Install the simulator environment
        run: |
          python -m venv sim-venv
          sim-venv/bin/pip install -r simulator/requirements.txt
      - name: Install the integration dependencies
        run: pip install "pymodbus==${{ matrix.pymodbus }}" voluptuous python-dateutil
      - name: Run hub polling tests
        run: python simulator/test_hub_polling.py
        env:
          ALFEN_SIM_PYTHON: sim-venv/bin/python
